services:
  postgres:
    image: postgres:16-alpine
    container_name: fillos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: foodapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - fillos_pgdata:/var/lib/postgresql/data

volumes:
  fillos_pgdata:

