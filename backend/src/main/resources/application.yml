server:
  port: 8080

spring:
  application:
    name: fillos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodapp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

fillos:
  jwt:
    secret: ${JWT_SECRET:Zn;f&@tGrPpj6grDdrnVX.}(X,=6SxqLB^Ub@WLg[3y3T=JbE5^TBaxhs2fL}Y1O}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  admin-bootstrap:
    enabled: ${FILLOS_BOOTSTRAP_ADMIN:false}
    phone: ${FILLOS_ADMIN_PHONE:+10000000001}
    name: ${FILLOS_ADMIN_NAME:Admin}
    email: ${FILLOS_ADMIN_EMAIL:admin@fillos.local}
    password: ${FILLOS_ADMIN_PASSWORD:}
  admin-registration:
    enabled: ${FILLOS_ADMIN_REGISTRATION_ENABLED:false}
    secret: ${FILLOS_ADMIN_REGISTRATION_SECRET:}
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: ${RAZORPAY_CURRENCY:INR}

